<!doctype html>
<!-- Facebook/Instagram product post, 1080x1080. Replace every {{...}}; __ASSETS__ = absolute path of the skill's assets folder. -->
<html lang="bn"><head><meta charset="utf-8">
<link rel="stylesheet" href="__ASSETS__/brand.css">
<style>
  .canvas{width:1080px;height:1080px}
  .frame{position:absolute;inset:28px;border:2px solid var(--gold);border-radius:6px;pointer-events:none}
  .photo-wrap{position:absolute;left:80px;top:96px;width:470px;height:884px;
    border-radius:235px 235px 18px 18px;overflow:hidden;background:var(--sand)}
  .photo-wrap img{width:100%;height:100%;object-fit:cover;object-position:center top}
  .side{position:absolute;left:600px;top:96px;width:400px;height:884px;display:flex;flex-direction:column}
  .logo{height:120px;align-self:flex-start}
  .kicker{margin-top:56px;font:600 26px var(--text);color:var(--gold-deep);letter-spacing:.5px}
  .name{margin-top:12px;font:800 64px/1.25 var(--display);max-height:240px;overflow:hidden}
  .details{margin-top:24px;font:500 27px/1.55 var(--text);color:var(--muted);max-height:170px;overflow:hidden}
  .price{margin-top:auto;display:flex;align-items:baseline;gap:18px}
  .now{font:700 76px var(--text);color:var(--ink)}
  .was{font:500 36px var(--text);color:var(--muted);text-decoration:line-through}
  .badge{position:absolute;left:440px;top:120px;width:150px;height:150px;border-radius:50%;
    background:var(--offer);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font:700 44px/1 var(--text);box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .badge small{font:600 22px var(--text);margin-top:6px}
  .contact{margin-top:28px;padding-top:22px;border-top:2px solid var(--gold);font:600 28px/1.5 var(--text)}
  .contact .web{font:500 24px var(--text);color:var(--muted)}
</style></head>
<body><div class="canvas">
  <div class="frame"></div>
  <div class="photo-wrap"><img src="{{PHOTO}}" alt=""></div>
  <!-- delete the badge div when there is no offer -->
  <div class="badge">{{OFFER}}<small>ছাড়</small></div>
  <div class="side">
    <img class="logo" src="__ASSETS__/logo-black.png" alt="">
    <div class="kicker">{{KICKER}}</div>
    <div class="name" data-fit="name">{{NAME}}</div>
    <div class="details" data-fit="details">{{DETAILS}}</div>
    <div class="price"><span class="now">৳{{PRICE}}</span><span class="was">৳{{OLD_PRICE}}</span></div>
    <div class="contact">WhatsApp: {{PHONE}}<div class="web">sunnahgallerybd.com</div></div>
  </div>
</div></body></html>
