name: Build Zahra BD APK

on:
  push:
    paths:
      - 'zahrabd-app/**'
      - '.github/workflows/zahrabd-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: zahrabd-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZahraBD-apk
          path: zahrabd-app/app/build/outputs/apk/debug/app-debug.apk
