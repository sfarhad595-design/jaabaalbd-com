name: Build Sunnah Gallery BD APK

on:
  push:
    paths:
      - 'sunnahgallery-app/**'
      - '.github/workflows/sunnahgallery-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: sunnahgallery-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp sunnahgallery-app/app/build/outputs/apk/debug/app-debug.apk SunnahGalleryBD.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SunnahGalleryBD-apk
          path: SunnahGalleryBD.apk

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sunnahgallery-v1.0-build${{ github.run_number }}
          name: Sunnah Gallery BD app (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: Android app for sunnahgallerybd.com. Download SunnahGalleryBD.apk and open it on your phone to install.
          files: SunnahGalleryBD.apk
